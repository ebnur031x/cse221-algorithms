<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
<rect width="1400" height="1800" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.h{font-weight:bold}.box{fill:#fafafa;stroke:#333;stroke-width:3}.code{font-family:monospace;font-size:24px}.small{font-size:23px}.mid{font-size:29px}.title{font-size:48px;font-weight:bold}.blue{fill:#173f9b}.green{fill:#18743a}.red{fill:#b21f1f}</style>
<text x="700" y="70" text-anchor="middle" class="title">CSE221 — SCC (Kosaraju) — VERIFIED FLOW</text>
<text x="700" y="110" text-anchor="middle" class="mid">Exact graph • exact stack • exact transpose • exact second DFS</text>
<rect x="30" y="140" width="650" height="390" rx="18" class="box"/><text x="55" y="180" class="h blue mid">1. ORIGINAL GRAPH G</text>
<text x="70" y="230" class="mid">1 ↔ 2 → 3 → 4</text><text x="250" y="280" class="mid">↙  ↓  ↘</text><text x="200" y="330" class="mid">5   6 ↔ 7</text><text x="480" y="230" class="mid">8 → 4</text>
<text x="55" y="390" class="h green">Adjacency list</text><text x="70" y="425" class="small">1:[2]   2:[1,3]   3:[4,5,6]   4:[]</text><text x="70" y="460" class="small">5:[]   6:[7]   7:[6]   8:[4]</text>
<rect x="710" y="140" width="660" height="390" rx="18" class="box"/><text x="735" y="180" class="h blue mid">2. FIRST DFS ON G</text><text x="735" y="225" class="small">Start at 1. Visit neighbors; push ONLY when finished.</text><text x="735" y="270" class="small">1→2→3→4  push 4</text><text x="735" y="305" class="small">back to 3→5  push 5</text><text x="735" y="340" class="small">3→6→7  push 7, then push 6</text><text x="735" y="375" class="small">push 3 → push 2 → push 1</text><text x="735" y="410" class="small">outer loop: 8→4(already visited), push 8</text><rect x="735" y="445" width="600" height="60" fill="#eef3ff" stroke="#294a9b"/><text x="1035" y="483" text-anchor="middle" class="mid">STACK bottom→top: [4,5,7,6,3,2,1,8]</text>
<rect x="30" y="560" width="650" height="500" rx="18" class="box"/><text x="55" y="600" class="h green mid">3. TRANSPOSE Gᵀ — REVERSE EVERY EDGE</text><text x="70" y="650" class="small">1↔2 stays mutual</text><text x="70" y="690" class="small">2→3 becomes 3→2</text><text x="70" y="730" class="small">3→4 becomes 4→3</text><text x="70" y="770" class="small">3→5 becomes 5→3</text><text x="70" y="810" class="small">3→6 becomes 6→3</text><text x="70" y="850" class="small">6↔7 stays mutual</text><text x="70" y="890" class="small">8→4 becomes 4→8</text><text x="55" y="940" class="h green">Adjacency list of Gᵀ</text><text x="70" y="980" class="small">1:[2]  2:[1]  3:[2]  4:[3,8]</text><text x="70" y="1015" class="small">5:[3]  6:[3,7]  7:[6]  8:[]</text>
<rect x="710" y="560" width="660" height="500" rx="18" class="box"/><text x="735" y="600" class="h red mid">4. SECOND DFS ON Gᵀ</text><text x="735" y="645" class="small">Pop 8 → 8:[ ] → SCC {8}</text><text x="735" y="690" class="small">Pop 1 → 1→2→1 → SCC {1,2}</text><text x="735" y="735" class="small">Pop 2 → already visited → skip</text><text x="735" y="780" class="small">Pop 3 → 3→2(visited) → SCC {3}</text><text x="735" y="825" class="small">Pop 6 → 6→3(visited), 6→7→6 → SCC {6,7}</text><text x="735" y="870" class="small">Pop 7 → already visited → skip</text><text x="735" y="915" class="small">Pop 5 → 5→3(visited) → SCC {5}</text><text x="735" y="960" class="small">Pop 4 → 4→3,8 (visited) → SCC {4}</text>
<rect x="30" y="1090" width="1340" height="300" rx="18" class="box"/><text x="55" y="1130" class="h blue mid">CODE ↔ MENTAL MODEL</text><text x="70" y="1180" class="code">void dfs1(int u) {</text><text x="105" y="1215" class="code">visited[u] = true;</text><text x="105" y="1250" class="code">for (int v : graph[u]) if (!visited[v]) dfs1(v);</text><text x="105" y="1285" class="code">stack.push(u); // AFTER all neighbors finish</text><text x="70" y="1325" class="code">}</text><text x="760" y="1180" class="small">void = returns nothing</text><text x="760" y="1220" class="small">int u = current vertex</text><text x="760" y="1260" class="small">graph[u] = u's outgoing neighbors</text><text x="760" y="1300" class="small">dfs1(v) = “now do the same thing from v”</text><text x="760" y="1340" class="small">stack.push(u) = record u AFTER its descendants</text>
<rect x="30" y="1420" width="1340" height="300" rx="18" class="box"/><text x="55" y="1460" class="h red mid">FINAL SCCs</text><text x="70" y="1520" class="title">{8}, {1,2}, {3}, {6,7}, {5}, {4}</text><text x="70" y="1580" class="mid">Core flow:</text><text x="260" y="1580" class="mid">DFS(G) → finish-time stack → transpose Gᵀ → DFS(Gᵀ) in stack order</text><text x="70" y="1640" class="mid">Time complexity: O(V + E)</text><text x="70" y="1685" class="mid">Key rule: in DFS #1, PUSH only after all reachable neighbors are finished.</text>
</svg>